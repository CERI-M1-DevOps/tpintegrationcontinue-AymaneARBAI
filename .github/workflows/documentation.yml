name: Documentation

on:
  pull_request:     
    branches:
      - main



jobs:
  if_merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: generation documentation
        run: mvn -B javadoc::javadoc
      - name: deployer documentation
        uses: peaceiris/actions-gh-pages@v4
